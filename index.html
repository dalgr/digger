<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<meta name="theme-color" content="#1b1420">
		<title>Digger</title>
		<!--
		Digger's web page: based on Godot 4.7.2's misc/dist/html/full-size.html (same engine start-up,
		feature checks and service worker handling), with a loading screen in the game's palette and
		a Play button.

		Start-up: the engine and the game pack download together (progress bar), then Play starts
		the engine inside the tap, so the browser lets audio start with the title music. Without a
		tap the engine still unlocks audio on the first input (godot_audio_resume). The button is
		skipped when this page already had a user gesture (navigator.userActivation, Baseline since
		2023), with ?autostart in the URL (tests, embeds that already ask for a click), or when the
		page was opened from a co-op join link (#room= or #join=, usually a scanned QR code): the
		player already said they're joining, so the game goes straight into it.

		viewport-fit=cover: the game fills the whole screen, under the Dynamic Island and home
		indicator too; the game keeps its controls inside the safe area (ScreenLayout).
		-->
		<style>
:root {
	--ink: #1b1420;
	--panel: #241b2b;
	--border: #4a3a52;
	--text: #f4ede4;
	--muted: #b8a9a0;
	--accent: #f2902e;
	--accent-dark: #b35a1e;
	--danger: #e5484d;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: var(--text);
	background-color: var(--ink);
	overflow: hidden;
	touch-action: none;
	font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 1.25rem;
	padding: 1rem;
	background-color: var(--ink);
	text-align: center;
	z-index: 1;
}

#title {
	margin: 0;
	font-size: clamp(2.5rem, 12vmin, 5.5rem);
	font-weight: 900;
	letter-spacing: 0.08em;
	color: var(--accent);
	/* Hard, offset shadows: the logo's dark outline, without loading an image or font. */
	text-shadow: 0.06em 0 0 var(--ink), -0.06em 0 0 var(--ink), 0 0.06em 0 var(--ink),
		0 -0.06em 0 var(--ink), 0.1em 0.1em 0 var(--accent-dark);
}

#tagline {
	margin: -0.75rem 0 0;
	color: var(--muted);
	font-size: clamp(0.8rem, 3.2vmin, 1.1rem);
}

#progress {
	width: min(60vw, 22rem);
	height: 0.75rem;
	border: 2px solid var(--border);
	background: var(--panel);
	overflow: hidden;
}

#progress-fill {
	height: 100%;
	width: 0;
	background: var(--accent);
}

#progress.indeterminate #progress-fill {
	width: 30%;
	animation: slide 1.2s ease-in-out infinite alternate;
}

@keyframes slide {
	from { transform: translateX(0); }
	to { transform: translateX(233%); }
}

#progress-text {
	min-height: 1.2em;
	color: var(--muted);
	font-size: 0.85rem;
}

#play, #reload {
	min-width: 12rem;
	min-height: 3rem; /* well over the 44 px touch target */
	padding: 0.5rem 1.5rem;
	border: 2px solid var(--accent);
	background: var(--panel);
	color: var(--text);
	font: inherit;
	font-size: 1.25rem;
	cursor: pointer;
}

#play:hover, #play:focus-visible, #reload:hover, #reload:focus-visible {
	background: var(--accent-dark);
	outline: none;
}

#notice {
	max-width: 32rem;
	padding: 1rem;
	border: 2px solid var(--danger);
	background: var(--panel);
	line-height: 1.4;
	white-space: pre-line;
}

[hidden] {
	display: none !important;
}

@media (prefers-reduced-motion: reduce) {
	#progress.indeterminate #progress-fill {
		animation: none;
		width: 100%;
		opacity: 0.5;
	}
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">
<style>html,body,#canvas{overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}</style><script>for(const t of ['contextmenu','gesturestart','gesturechange','gestureend'])document.addEventListener(t,(e)=>e.preventDefault(),{passive:false});</script>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Digger needs JavaScript to run.
		</noscript>

		<div id="status">
			<h1 id="title">DIGGER</h1>
			<p id="tagline">Drill deep. Get rich. Don't run out of fuel.</p>
			<div id="progress" class="indeterminate" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100">
				<div id="progress-fill"></div>
			</div>
			<div id="progress-text" aria-live="polite">Loading…</div>
			<button id="play" type="button" hidden>Play</button>
			<div id="notice" role="alert" hidden></div>
			<button id="reload" type="button" hidden>Reload</button>
		</div>

		<script>
// Installing (WebPlatform): Chrome, Edge and Android browsers offer to install the page as an app
// with a beforeinstallprompt event, which can arrive before the engine starts. Keep it for the
// game's Install button (WebPlatform.install()), and tell the game when it arrives or is used.
window.__diggerInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (event) => {
	event.preventDefault(); // no mini-infobar: the title screen offers it instead
	window.__diggerInstallPrompt = event;
	if (window.__diggerInstallChanged) window.__diggerInstallChanged();
});
window.addEventListener('appinstalled', () => {
	window.__diggerInstallPrompt = null;
	if (window.__diggerInstallChanged) window.__diggerInstallChanged();
});
		</script>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":1517144,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
let onProgress = null;
// onProgress goes in through the constructor's EngineConfig (documented), not by editing config.
const engine = new Engine(Object.assign({}, GODOT_CONFIG, {
	'onProgress': (current, total) => onProgress && onProgress(current, total),
}));

(function () {
	const status = document.getElementById('status');
	const progress = document.getElementById('progress');
	const progressFill = document.getElementById('progress-fill');
	const progressText = document.getElementById('progress-text');
	const play = document.getElementById('play');
	const notice = document.getElementById('notice');
	const reload = document.getElementById('reload');

	function showProgress(current, total) {
		if (current > 0 && total > 0) {
			const ratio = Math.min(1, current / total);
			progress.classList.remove('indeterminate');
			progressFill.style.width = `${(ratio * 100).toFixed(1)}%`;
			progress.setAttribute('aria-valuenow', Math.round(ratio * 100));
			// A percentage, not MB: the engine counts uncompressed bytes (~38 MB) while the
			// download is compressed (~7 MB), so megabytes would mislead.
			progressText.textContent = `Loading ${Math.floor(ratio * 100)}%`;
		} else {
			// Sizes unknown (e.g. a server that compresses on the fly sends no length).
			progress.classList.add('indeterminate');
			progress.removeAttribute('aria-valuenow');
		}
	}

	function fail(err) {
		console.error(err);
		let text = 'Something went wrong while starting the game.';
		if (err instanceof Error) {
			text = err.message;
		} else if (typeof err === 'string') {
			text = err;
		}
		if (/^Failed loading/.test(text)) {
			text = `Couldn't download the game. Check your connection and try again.\n(${text})`;
		}
		progress.hidden = true;
		progressText.hidden = true;
		play.hidden = true;
		notice.textContent = text;
		notice.hidden = false;
		reload.hidden = false;
	}

	reload.addEventListener('click', () => window.location.reload());

	function start() {
		play.hidden = true;
		progressText.textContent = 'Starting…';
		const pack = GODOT_CONFIG['mainPack'] || `${GODOT_CONFIG['executable']}.pck`;
		engine.start({ 'args': ['--main-pack', pack] }).then(() => {
			status.remove();
		}, fail);
	}

	function load() {
		// startGame() without the start: the engine and the main pack download together.
		const exe = GODOT_CONFIG['executable'];
		const pack = GODOT_CONFIG['mainPack'] || `${exe}.pck`;
		onProgress = showProgress;
		return Promise.all([engine.init(exe), engine.preloadFile(pack, pack)]);
	}

	function ready() {
		progress.hidden = true;
		const skip = new URLSearchParams(window.location.search).has('autostart')
			|| /^#(room|join)=/.test(window.location.hash)
			|| (navigator.userActivation && navigator.userActivation.hasBeenActive);
		if (skip) {
			start();
			return;
		}
		progressText.textContent = '';
		play.hidden = false;
		play.addEventListener('click', start, { once: true });
		play.focus();
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			// As in Godot's page: installing the service worker may provide the missing headers.
			let registration;
			try {
				registration = navigator.serviceWorker.getRegistration();
			} catch (err) {
				registration = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				registration.then((existing) => {
					if (existing != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return existing;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			fail('This browser is missing features Digger needs:\n' + missing.join('\n')
				+ '\n\nTry an up-to-date Chrome, Safari, Firefox or Edge.');
		}
	} else {
		load().then(ready, fail);
	}
}());
		</script>
	</body>
</html>
